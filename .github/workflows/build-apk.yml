name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/CampusCompanion.apk
          echo "APK generated successfully: $(ls -lh release-artifacts/CampusCompanion.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCompanion-APK
          path: release-artifacts/CampusCompanion.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Campus Companion ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest APK' }}
          body: |
            ## 📱 Campus Companion - Engineering Student Utility

            ### ⬇️ Direct Download
            Download the pre-built APK directly to your phone:
            - **[CampusCompanion.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/CampusCompanion.apk)**

            ---

            ### 🚀 Quick Android Installation Guide
            1. **Download**: Click the `CampusCompanion.apk` link above on your Android phone.
            2. **Open**: Once downloaded, tap on the completed download notification or open it from your **Files** / **Downloads** folder.
            3. **Allow Installation**: If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*:
               - Tap **Settings**.
               - Turn ON **"Allow from this source"**.
               - Press the back button to return to the installer.
            4. **Install**: Tap **Install**.
            5. If Google Play Protect shows *"Unrecognized app"*, tap **More details** ➔ **Install anyway**.

            ---

            ### ✨ Key Highlights
            - 🛡️ **100% Offline & Private**: Zero internet permissions requested, no data leaves your device.
            - 🍽️ **Mess Timetable**: Complete weekly breakfast, lunch, snacks, and dinner schedules.
            - 🎓 **Class Timetable**: Tailored for EE-VLSI with G1/G2 lab batches and room allocations.
            - ⏰ **Exact Alarms**: Uses Android `AlarmManager.setAlarmClock()` for millisecond-exact reminders that bypass Doze mode.
            - 📝 **Task Manager**: Assignments, homework deadlines, and custom reminders.
            - 🎨 **Liquid Glass UI**: Translucent frosted-glass aesthetic, dynamic day/night gradients, and responsive tablet layout.
          files: release-artifacts/CampusCompanion.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
